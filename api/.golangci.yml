run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - misspell
    - bodyclose
    - prealloc
    - unconvert
    - nilerr

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - ifElseChain
      - hugeParam
      - unnamedResult
      - unnecessaryBlock
  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: exported
        disabled: true
      - name: unused-parameter
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
        - bodyclose
