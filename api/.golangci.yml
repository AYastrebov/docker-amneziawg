version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - misspell
    - bodyclose
    - prealloc
    - unconvert
    - copyloopvar
    - nilerr
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam
        - unnamedResult
        - unnecessaryBlock
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
