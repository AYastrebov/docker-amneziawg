version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam
        - unnamedResult
        - unnecessaryBlock
      enabled-tags:
        - diagnostic
        - performance
        - style
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - errcheck
          - gocritic
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
