name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      amneziawg_go_version:
        description: 'amneziawg-go version (e.g., v0.2.16)'
        required: false
      amneziawg_tools_version:
        description: 'amneziawg-tools version (e.g., v1.0.20260223)'
        required: false
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1
  # Upstream versions are read from the Dockerfile ARG pins (single source of truth).
  # workflow_dispatch inputs override them for one-off builds.

jobs:
  # Decide whether this event touches the image at all. Only Dockerfile, root/,
  # .dockerignore and this workflow end up in (or shape) the published image —
  # docs, skills and compose examples do not, so a push that changes only those
  # must not rebuild and republish :latest / the tools-version tag.
  #
  # This is a diff gate rather than an `on.push.paths` filter on purpose: the
  # push block also carries the v* tag trigger, and path filters behave
  # ambiguously for tag pushes (no reliable before/after diff), which could
  # silently break semver releases. An explicit gate fails open instead.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether image-affecting paths changed
        id: filter
        run: |
          IMAGE_PATHS='^(Dockerfile$|root/|\.dockerignore$|\.github/workflows/docker-build\.yml$)'
          # The smoke test only runs in the PR job; on master a change to it
          # alone must not rebuild and push the image.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IMAGE_PATHS='^(Dockerfile$|root/|\.dockerignore$|tests/smoke\.sh$|\.github/workflows/docker-build\.yml$)'
          fi

          # Anything that is not a plain branch push builds unconditionally:
          # tag pushes (semver releases), manual dispatch (version overrides).
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref_type }}" == "tag" ]]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "build: yes (${{ github.event_name }}/${{ github.ref_type }})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # New branch or force-push where the old tip is gone: no diff to
          # inspect, so fail open and build.
          if [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "build: yes (no comparable base commit)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE "$IMAGE_PATHS"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "build: yes (image-affecting paths changed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "build: skipped — no changes to Dockerfile, root/, .dockerignore or this workflow (tests/smoke.sh counts on pull requests only)" >> "$GITHUB_STEP_SUMMARY"
          fi

  unit-tests:
    name: Unit tests (ipv6-lib)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        run: bash tests/ipv6-lib.test.sh

  build:
    # unit-tests gates the image too: a red ipv6-lib test must never reach :latest
    needs: [changes, unit-tests]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve upstream versions
        id: versions
        run: |
          # workflow_dispatch inputs take precedence; otherwise read the pins from the Dockerfile
          AWG_GO="${{ github.event.inputs.amneziawg_go_version }}"
          AWG_TOOLS="${{ github.event.inputs.amneziawg_tools_version }}"
          if [[ -z "$AWG_GO" ]]; then
            AWG_GO=$(grep '^ARG AMNEZIAWG_GO_VERSION=' Dockerfile | cut -d= -f2)
          fi
          if [[ -z "$AWG_TOOLS" ]]; then
            AWG_TOOLS=$(grep '^ARG AMNEZIAWG_TOOLS_VERSION=' Dockerfile | cut -d= -f2)
          fi
          if [[ -z "$AWG_GO" || -z "$AWG_TOOLS" ]]; then
            echo "::error::Could not resolve upstream versions (go: '${AWG_GO}', tools: '${AWG_TOOLS}')"
            exit 1
          fi
          echo "amneziawg_go=${AWG_GO}" >> "$GITHUB_OUTPUT"
          echo "amneziawg_tools=${AWG_TOOLS}" >> "$GITHUB_OUTPUT"
          # Strip 'v' prefix for version label (v1.0.20260223 -> 1.0.20260223)
          echo "tools_version=${AWG_TOOLS#v}" >> "$GITHUB_OUTPUT"
          echo "## Build versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- amneziawg-go: \`${AWG_GO}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- amneziawg-tools: \`${AWG_TOOLS}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with upstream amneziawg-tools version (e.g., 1.0.20260223)
            type=raw,value=${{ steps.versions.outputs.tools_version }},enable={{is_default_branch}}
            # Tag with branch name
            type=ref,event=branch
            # Tag with PR number
            type=ref,event=pr
            # Tag with git tag (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # Tag with major.minor (v1.0.0 -> 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with major (v1.0.0 -> 1)
            type=semver,pattern={{major}}
            # Tag with short sha
            type=sha,prefix=sha-

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ steps.versions.outputs.tools_version }}
            AMNEZIAWG_GO_VERSION=${{ steps.versions.outputs.amneziawg_go }}
            AMNEZIAWG_TOOLS_VERSION=${{ steps.versions.outputs.amneziawg_tools }}
            BUILDKIT_INLINE_CACHE=1
          provenance: false
          sbom: false

      - name: Test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # Build for local testing (single platform)
          docker buildx build --platform linux/amd64 --load -t test-image \
            --build-arg AMNEZIAWG_GO_VERSION=${{ steps.versions.outputs.amneziawg_go }} \
            --build-arg AMNEZIAWG_TOOLS_VERSION=${{ steps.versions.outputs.amneziawg_tools }} \
            .

          # The checks live in tests/smoke.sh: GitHub rejects a run step over
          # 21,000 characters at load time, which this one outgrew.
          bash tests/smoke.sh

  release:
    needs: build
    # Only on merges to the default branch — not on PRs, tags, or manual dispatch
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release for new upstream version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOLS_VERSION=$(grep '^ARG AMNEZIAWG_TOOLS_VERSION=' Dockerfile | cut -d= -f2)
          GO_VERSION=$(grep '^ARG AMNEZIAWG_GO_VERSION=' Dockerfile | cut -d= -f2)
          TAG="${TOOLS_VERSION}"  # already carries the v prefix
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — nothing to do."
            exit 0
          fi

          cat > release-notes.md <<EOF
          ## AmneziaWG Docker Container ${TAG}

          ### Upstream versions
          - **amneziawg-tools**: ${TOOLS_VERSION}
          - **amneziawg-go**: ${GO_VERSION}

          ### Docker image

          \`\`\`bash
          docker pull ${IMAGE}:latest
          # or pin to this version:
          docker pull ${IMAGE}:${TAG#v}
          \`\`\`
          EOF

          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          echo "Created release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
